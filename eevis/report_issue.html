<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit GitHub Issue - EEVIS</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f7f7f7; 
            margin: 0;
            padding: 20px;
        }
        .container { 
            max-width: 500px; 
            margin: 60px auto; 
            background: #fff; 
            padding: 32px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px #ccc; 
        }
        h2 { 
            text-align: center; 
            color: #333;
            margin-bottom: 24px;
        }
        .error { 
            color: #d32f2f; 
            text-align: center; 
            margin-bottom: 16px; 
            padding: 8px;
            background: #ffebee;
            border-radius: 4px;
        }
        .success { 
            color: #2e7d32; 
            text-align: center; 
            margin-bottom: 16px; 
            padding: 8px;
            background: #e8f5e8;
            border-radius: 4px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], textarea, select { 
            width: 100%; 
            padding: 10px; 
            margin: 0 0 16px 0; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            font-family: Arial, sans-serif;
        }
        button { 
            width: 100%; 
            padding: 10px; 
            background: #8d6e63; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 16px; 
            margin-bottom: 10px; 
            cursor: pointer; 
        }
        button:hover { 
            background: #6d4c41; 
        }
        .button-container { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .cancel-button { 
            background: #8d6e63; 
            color: white; 
            text-decoration: none; 
            display: block; 
            text-align: center; 
            padding: 10px; 
            border-radius: 4px; 
            font-size: 16px; 
        }
        .cancel-button:hover { 
            background: #6d4c41; 
        }
        .user-info {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }
        .user-info strong {
            color: #8d6e63;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Submit GitHub Issue</h2>
        
        {{ if .username }}
        <div class="user-info">
            Logged in as: <strong>{{ .username }}</strong>
        </div>
        {{ end }}
        
        {{ if .error }}
        <div class="error">{{ .error }}</div>
        {{ end }}
        
        {{ if .success }}
        <div class="success">{{ .success }}</div>
        {{ end }}
        
        <form method="POST" action="/eevis/report-issue">
            <label for="repo">Repository:</label>
            <select id="repo" name="repo" required>
                <option value="eevis-go">eevis-go</option>
                <option value="eevis_flutter">eevis_flutter</option>
            </select>
            
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
            
            <label for="body">Description:</label>
            <textarea id="body" name="body" rows="6" required></textarea>
            
            <div class="button-container">
                <button type="submit">Submit Issue</button>
                <a href="/eevis" class="cancel-button">Home</a>
            </div>
        </form>
    </div>
</body>
</html>
